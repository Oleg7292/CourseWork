services:
  db:
    image: postgres:15-alpine
    container_name: bank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/initdata.sql:/docker-entrypoint-initdb.d/02_initdata.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bank_network

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bank_server
    restart: unless-stopped
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=bank_db
      - DB_USER=bank_user
      - DB_PASSWORD=bank_secure_password_2024
      - JWT_SECRET=bank_jwt_super_secret_key_2024_information_security
      - JWT_EXPIRES_IN=24h
      - NODE_ENV=production
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank_network

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - bank_network

volumes:
  postgres_data:

networks:
  bank_network:
    driver: bridge
